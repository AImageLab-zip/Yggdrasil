<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yggdrasil world-tree">
  <defs>
    <linearGradient id="yggCanopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ae9cb"/>
      <stop offset="1" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="yggTree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb8ff"/>
      <stop offset="0.5" stop-color="#dff8ff"/>
      <stop offset="1" stop-color="#6f9dff"/>
    </linearGradient>
  </defs>
  <!-- foliage halo -->
  <circle cx="32" cy="22" r="15" fill="url(#yggCanopy)" opacity="0.18"/>
  <circle cx="32" cy="22" r="15" fill="none" stroke="url(#yggCanopy)" stroke-width="1.2" opacity="0.5"/>
  <g fill="none" stroke="url(#yggTree)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk -->
    <path d="M32 42 L32 24"/>
    <!-- upper branches -->
    <path d="M32 30 C26 27 23 23 22 17"/>
    <path d="M32 30 C38 27 41 23 42 17"/>
    <path d="M32 24 C29 20 28 17 29 12"/>
    <path d="M32 24 C35 20 36 17 35 12"/>
    <path d="M32 24 L32 11"/>
    <!-- branch tips / leaves -->
    <circle cx="22" cy="16" r="1.7" fill="url(#yggCanopy)" stroke="none"/>
    <circle cx="42" cy="16" r="1.7" fill="url(#yggCanopy)" stroke="none"/>
    <circle cx="29" cy="11" r="1.5" fill="url(#yggCanopy)" stroke="none"/>
    <circle cx="35" cy="11" r="1.5" fill="url(#yggCanopy)" stroke="none"/>
    <circle cx="32" cy="10" r="1.7" fill="url(#yggCanopy)" stroke="none"/>
    <!-- mirrored roots -->
    <path d="M32 42 C26 45 23 49 22 55"/>
    <path d="M32 42 C38 45 41 49 42 55"/>
    <path d="M32 42 C29 47 28 51 29 57"/>
    <path d="M32 42 C35 47 36 51 35 57"/>
  </g>
</svg>
