name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: VERSION must match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "VERSION file ($ver) does not match tag ($tag)" >&2
            exit 1
          fi
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! [ -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG.md section for $ver" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
