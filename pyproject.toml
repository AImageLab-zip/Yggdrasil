# Lint configuration only — this repo is not a pip-installable package.
[tool.ruff]
target-version = "py311"
extend-exclude = [
    "staticfiles",
    "logs",
    "scripts",
    "*/migrations/*",
]

[tool.ruff.lint]
# Permissive baseline on purpose: syntax errors, undefined names and unused
# imports, plus the bandit-derived security rules ("S").
# The codebase mixes tabs/spaces and predates any formatter — no style
# enforcement here. Widen one rule at a time, each with its cleanup.
select = ["E9", "F63", "F7", "F82", "F401", "S"]
# S110/S112 (try-except-pass/continue) are a pervasive legacy pattern here,
# not a security signal; auditing them is style work, not release work.
ignore = ["S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and throwaway credentials by design.
"**/tests*.py" = ["S101", "S105", "S106"]
# CLI-only admin command; db/table names come from argv + a fixed allowlist,
# never from web input.
"common/management/commands/import_legacy_prod.py" = ["S608"]
# subprocess/urlopen with arguments built from settings and job records,
# never from request data. No shell=True anywhere.
"common/tasks.py" = ["S603", "S607"]
"common/export_processing.py" = ["S603", "S607"]
"laparoscopy/export_processor.py" = ["S603"]
# The same ffprobe call, extracted from export_processor.py in Phase 10 and not
# given the ignore its origin carried -- so `ruff check .` has been failing on
# release/3.0 since that commit. argv is a fixed list plus a local path this
# process just wrote or downloaded; no shell=True.
"laparoscopy/video_probe.py" = ["S603"]
# Magic Tool worker proxy: target URL comes from settings (WORKER_*_URL),
# not from the request.
"laparoscopy/views.py" = ["S310"]

# Import direction (CLAUDE.md, docs/architecture.md): domain apps -> annotations ->
# common, and domain apps do not import each other. Checked in CI by `lint-imports`.
[tool.importlinter]
root_packages = ["common", "annotations", "maxillo", "brain", "laparoscopy", "urology", "cardiology"]

