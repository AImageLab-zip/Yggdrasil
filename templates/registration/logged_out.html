{% extends 'base.html' %}

{% block title %}Logged Out - Yggdrasil{% endblock %}

{% block content %}
{% load static %}
<div class="container">
    <div class="ygg-auth-wrap">
        <div class="ygg-auth-card text-center">
            <img src="{% static 'icons/ygg-logo.svg' %}" alt="Yggdrasil" class="brand-mark">
            <h2>Logged Out</h2>
            <hr class="ygg-gold-rule">
            <p class="mb-4">You have been successfully logged out.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">
                <i class="fas fa-sign-in-alt me-2"></i>Log In Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
