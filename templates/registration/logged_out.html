{% extends 'base.html' %}
{% load icons %}

{% block title %}Logged Out - Yggdrasil{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card text-center">
        <div class="flex justify-center mb-1">
            {% include 'common/partials/wordmark.html' with variant='ink' size='lg' %}
        </div>
        <h1 class="text-xl">Signed out</h1>
        <hr class="auth-rule">
        <p class="text-content-muted mb-6">You have been successfully logged out.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">{% icon 'sign-in-alt' %}<span>Log in again</span></a>
    </div>
</div>
{% endblock %}
