<article class="upload-modality upload-modality--wide volume-upload-container" data-group="cbct">
    <div class="upload-modality__head"><i class="fas fa-cube" aria-hidden="true"></i><h3>CBCT scan</h3></div>
    <div class="cbct-file-section">
        <label class="upload-dropzone" for="{{ patient_upload_form.cbct.id_for_label }}">
            {{ patient_upload_form.cbct }}
            <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
            <strong>Drop a CBCT file</strong>
            <small>NIfTI or MetaImage (.mha)</small>
            <span class="upload-file-summary" data-file-summary>No file selected</span>
        </label>
        {% for error in patient_upload_form.cbct.errors %}<small class="upload-error">{{ error }}</small>{% endfor %}
    </div>
</article>
