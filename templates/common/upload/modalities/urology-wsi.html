<article class="upload-modality">
    <div class="upload-modality__head">
        <i class="fas fa-microscope" aria-hidden="true"></i>
        <h3>WSI</h3>
    </div>
    <label class="upload-dropzone" for="urology-wsi_file">
        <input type="file" name="urology-wsi" id="urology-wsi_file" accept=".tiff,.tif,.svs,.ndpi,.mrxs,.dz,.jpg,.jpeg">
        <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
        <strong>Drop WSI slide (.tiff, .svs, .jpg)</strong>
        <small>Pyramidal TIFF or flat gigapixel JPG (converted automatically in browser)</small>
        <span class="upload-file-summary" data-file-summary>No file selected</span>
    </label>
    <label class="upload-dropzone mt-2" for="urology-wsi-seg_file">
        <input type="file" name="urology-wsi-segmentation" id="urology-wsi-seg_file" accept=".geojson,.json">
        <i class="fas fa-shapes" aria-hidden="true"></i>
        <strong>Segmentation (.geojson)</strong>
        <small>QuPath or AI polygon masks (optional)</small>
        <span class="upload-file-summary" data-file-summary>No segmentation selected</span>
    </label>
</article>
