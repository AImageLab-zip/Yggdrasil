<article class="upload-modality">
    <div class="upload-modality__head">
        <i class="fas fa-magnet" aria-hidden="true"></i>
        <h3>MRI</h3>
    </div>
    <label class="upload-dropzone" for="urology-mri_file">
        <input type="file" name="urology-mri" id="urology-mri_file" accept=".nii,.nii.gz">
        <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
        <strong>Drop MRI volume (.nii, .nii.gz)</strong>
        <small>Multi-parametric MRI scan</small>
        <span class="upload-file-summary" data-file-summary>No file selected</span>
    </label>
</article>
