<article class="upload-modality upload-modality--wide">
    <div class="upload-modality__head"><i class="fas fa-video" aria-hidden="true"></i><h3>Surgical video</h3></div>
    <label class="upload-dropzone" for="{{ patient_upload_form.video.id_for_label }}">
        {{ patient_upload_form.video }}
        <i class="fas fa-film" aria-hidden="true"></i>
        <strong>Drop a surgical video</strong><small>MP4 or AVI</small>
        <span class="upload-file-summary" data-file-summary>No file selected</span>
    </label>
    {% for error in patient_upload_form.video.errors %}<small class="upload-error">{{ error }}</small>{% endfor %}
</article>
