<article class="upload-modality">
    <div class="upload-modality__head"><i class="fas fa-camera" aria-hidden="true"></i><h3>Intraoral photographs</h3></div>
    <label class="upload-dropzone" for="intraoral-photos">
        <input type="file" name="intraoral-photos" id="intraoral-photos" accept=".jpg,.jpeg,.png" multiple>
        <i class="fas fa-images" aria-hidden="true"></i>
        <strong>Drop 1-10 photos</strong><small>JPG or PNG</small>
        <span class="upload-file-summary" data-file-summary>No files selected</span>
    </label>
</article>
