<article class="upload-modality">
    <div class="upload-modality__head"><i class="fas fa-panorama" aria-hidden="true"></i><h3>Panoramic</h3></div>
    <label class="upload-dropzone" for="{{ patient_upload_form.panoramic.id_for_label }}">
        {{ patient_upload_form.panoramic }}
        <i class="fas fa-image" aria-hidden="true"></i>
        <strong>Drop an image</strong><small>JPG or PNG</small>
        <span class="upload-file-summary" data-file-summary>No file selected</span>
    </label>
    {% for error in patient_upload_form.panoramic.errors %}<small class="upload-error">{{ error }}</small>{% endfor %}
</article>
