{% comment %}
Scoped legacy layer scripts — include in {% block extra_js %} on the patient
list / patient detail / export pages. Provides Bootstrap's JS runtime (modals,
collapse, dropdowns) and initializes tooltips (previously global in base.html).
{% endcomment %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.bootstrap && document.querySelector('[data-bs-toggle="tooltip"]')) {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
                new window.bootstrap.Tooltip(el);
            });
        }
    });
</script>
