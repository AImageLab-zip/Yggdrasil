name: yggdrasil-${DOCKER_SUFFIX}

services:
    web:
        build: .
        container_name: yggdrasil-web-${DOCKER_SUFFIX}
        working_dir: /app
        command: /app/entrypoint.sh
        ports:
            - "${WEB_EXTERNAL_PORT}:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            VIRTUAL_HOST: ${VIRTUAL_HOST:-${DOMAIN:-}}
            VIRTUAL_PORT: ${VIRTUAL_PORT:-8000}
            LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-${VIRTUAL_HOST:-${DOMAIN:-}}}
            LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
            DB_HOST: yggdrasil-db-${DOCKER_SUFFIX}
            PYTHONPATH: /app
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - app_logs:/app/logs
            - app_staticfiles:/app/staticfiles
            - app_media:/app/media
            - app_processing:/tmp/processing
        networks:
            - app-net
            - proxy-net

    beat:
        build: .
        container_name: yggdrasil-beat-${DOCKER_SUFFIX}
        working_dir: /app
        command: python -m celery -A yggdrasil beat --loglevel=info --schedule /tmp/celerybeat-schedule
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            DB_HOST: yggdrasil-db-${DOCKER_SUFFIX}
            PYTHONPATH: /app
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - app_logs:/app/logs
            - celery_beat_schedule:/tmp
        networks:
            - app-net

    maintenance-worker:
        build: .
        container_name: yggdrasil-maintenance-${DOCKER_SUFFIX}
        working_dir: /app
        command: python -m celery -A yggdrasil worker --queues ${MAINTENANCE_QUEUE:-maintenance} --concurrency 1 --loglevel=info
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            DB_HOST: yggdrasil-db-${DOCKER_SUFFIX}
            PYTHONPATH: /app
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - app_logs:/app/logs
            - app_backups:/app/backups
            - app_processing:/tmp/processing
        networks:
            - app-net

    runner-worker:
        build: .
        container_name: yggdrasil-runner-${DOCKER_SUFFIX}
        working_dir: /app
        # Consumes every runner queue (RUNNER_QUEUES from .env.worker) and drives the
        # SLURM cluster over SSH. The ONLY service with the SSH key + cluster config.
        command: sh -c 'python -m celery -A yggdrasil worker --queues "$${RUNNER_QUEUES:-runner_prod}" --concurrency "$${RUNNER_CONCURRENCY:-4}" --loglevel=info'
        environment:
            PYTHONPATH: /app
        env_file:
            - .env
            - .env.worker
        restart: unless-stopped
        volumes:
            - app_logs:/app/logs
            # SSH key mounted read-only; path must match SLURM_SSH_KEY in .env.worker.
            - ${SLURM_SSH_KEY_HOST:-./secrets/slurm_ssh_key}:/run/secrets/slurm_ssh_key:ro
            # Paramiko rejects unknown hosts; pre-populate with ssh-keyscan for the cluster login node.
            - ${SLURM_KNOWN_HOSTS_HOST:-./secrets/slurm_known_hosts}:/root/.ssh/known_hosts:ro
        network_mode: bridge

    db:
        image: mysql:8.0
        container_name: yggdrasil-db-${DOCKER_SUFFIX}
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "${DB_EXTERNAL_PORT}:3306"
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${MYSQL_ROOT_PASSWORD}",
                ]
            timeout: 20s
            retries: 10
            interval: 10s
            start_period: 30s
        restart: unless-stopped
        networks:
            - app-net

    redis:
        image: redis:7-alpine
        container_name: yggdrasil-redis-${DOCKER_SUFFIX}
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "${REDIS_EXTERNAL_PORT}:6379"
        restart: unless-stopped
        networks:
            - app-net

volumes:
    mysql_data:
    app_logs:
    app_staticfiles:
    app_media:
    app_backups:
    app_processing:
    celery_beat_schedule:

networks:
    proxy-net:
        external: true
    app-net:
        name: app-net-${DOCKER_SUFFIX}
        external: true
