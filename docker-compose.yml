name: yggdrasil-$DOCKER_SUFFIX

services:
    web:
        build: .
        container_name: yggdrasil-web-$DOCKER_SUFFIX
        volumes:
            - .:/app
        command: /app/entrypoint.sh
        ports:
            - "$WEB_EXTERNAL_PORT:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        environment:
            VIRTUAL_HOST: ${VIRTUAL_HOST:-${DOMAIN:-}}
            VIRTUAL_PORT: ${VIRTUAL_PORT:-8000}
            LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-${VIRTUAL_HOST:-${DOMAIN:-}}}
            LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
            DB_HOST: yggdrasil-db-$DOCKER_SUFFIX

        env_file:
            - .env
        user: "$UID:$GID"
        restart: unless-stopped
        networks:
            - app-net
            - proxy-net

    # Maintenance: celery beat scheduler + local worker for the maintenance
    # queue (daily DB backups). MAINTENANCE_QUEUE must never overlap
    # RUNNER_DEFAULT_QUEUE / RUNNER_QUEUE_BY_* - settings.py enforces this.
    beat:
        build: .
        container_name: yggdrasil-beat-$DOCKER_SUFFIX
        volumes:
            - .:/app
        command: celery -A yggdrasil beat --loglevel=info --schedule /tmp/celerybeat-schedule
        environment:
            DB_HOST: yggdrasil-db-$DOCKER_SUFFIX
        env_file:
            - .env
        user: "$UID:$GID"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - app-net

    maintenance-worker:
        build: .
        container_name: yggdrasil-maintenance-$DOCKER_SUFFIX
        volumes:
            - .:/app
        command: celery -A yggdrasil worker --queues ${MAINTENANCE_QUEUE:-maintenance} --concurrency 1 --loglevel=info
        environment:
            DB_HOST: yggdrasil-db-$DOCKER_SUFFIX
        env_file:
            - .env
        user: "$UID:$GID"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - app-net

    db:
        image: mysql:8.0
        container_name: yggdrasil-db-$DOCKER_SUFFIX
        environment:
            MYSQL_DATABASE: $MYSQL_DATABASE
            MYSQL_USER: $MYSQL_USER
            MYSQL_PASSWORD: $MYSQL_PASSWORD
            MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "$DB_EXTERNAL_PORT:3306"
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p$MYSQL_ROOT_PASSWORD",
                ]
            timeout: 20s
            retries: 10
            interval: 10s
            start_period: 30s
        restart: unless-stopped
        networks:
            - app-net

    redis:
        image: redis:7-alpine
        container_name: yggdrasil-redis-$DOCKER_SUFFIX
        command: redis-server --requirepass ${REDIS_PASSWORD}
        restart: unless-stopped
        ports:
            - "$REDIS_EXTERNAL_PORT:6379"
        networks:
            - app-net

volumes:
    mysql_data:

networks:
    proxy-net:
        external: true
    app-net:
